document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor:#12B886;margin-top:2px;\">#0c1512<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8B8880;margin-top:4px;line-height:1.4;\">Текст на изумрудном фоне.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #23262c;display:flex;align-items:center;gap:14px;padding:14px 16px;background:#101216;\">\n        <div style=\"width:44px;height:44px;background:#D2CEC6;flex:0 0 auto;\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:13.5px;color:#E7E4DD;\">Тёплая кость<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#12B886;margin-top:2px;\">#D2CEC6<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8B8880;margin-top:4px;line-height:1.4;\">Body-текст и цитаты на тёмном.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #23262c;display:flex;align-items:center;gap:14px;padding:14px 16px;background:#101216;\">\n        <div style=\"width:44px;height:44px;background:#8B8880;flex:0 0 auto;\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:13.5px;color:#E7E4DD;\">Дым<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#12B886;margin-top:2px;\">#8B8880<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8B8880;margin-top:4px;line-height:1.4;\">Вторичная мета, подзаголовки.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #23262c;display:flex;align-items:center;gap:14px;padding:14px 16px;background:#101216;\">\n        <div style=\"width:44px;height:44px;background:#2a2d34;flex:0 0 auto;\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:13.5px;color:#E7E4DD;\">Линия<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#12B886;margin-top:2px;\">#2a2d34<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8B8880;margin-top:4px;line-height:1.4;\">Разделители 2px на графите.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-top:28px;\">\n      <div style=\"flex:1 1 380px;border:1px solid #23262c;background:#101216;padding:22px 24px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#12B886;margin-bottom:14px;\">Правила цвета<\u002Fdiv>\n        <div style=\"font-size:14px;color:#D2CEC6;line-height:1.65;\">Изумруд только для одного смысла на слайде: цифра, метка или вывод. Два изумрудных пятна в одном блоке уже перебор.<br>На изумрудном фоне текст всегда уголь #0c1512, никогда белый.<br>Разделитель на изумруде rgba(12,21,18,.28), на графите #2a2d34.<br>Градиентов, теней-ореолов и вторых акцентов нет.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;border:1px solid #23262c;background:#101216;padding:22px 24px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#12B886;margin-bottom:14px;\">Что запрещено<\u002Fdiv>\n        <div style=\"font-size:14px;color:#D2CEC6;line-height:1.65;\">Эмодзи в макетах. Тире «—» в текстах и на слайдах, кроме грамматического перед «это»: диапазоны пишем словом «до».<br>Декоративная графика: пластины, весы, svg-снаряды.<br>Монохромный PDF-бандл дизайн-системы: он ч/б и на Instrument Serif, противоречит бренду.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"type\" style=\"max-width:1240px;margin:0 auto 80px;\">\n    <div style=\"margin-bottom:28px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:#12B886;margin-bottom:12px;\">03 · Типографика<\u002Fdiv>\n      <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:40px;line-height:0.95;text-transform:uppercase;letter-spacing:0.01em;color:#E7E4DD;\">Три гарнитуры, без исключений<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;\">\n      <div style=\"display:flex;gap:36px;align-items:flex-start;padding:28px 0;border-top:1px solid #23262c;\">\n        <div style=\"flex:0 0 220px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#12B886;\">Saira Condensed<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8B8880;margin-top:8px;line-height:1.45;\">Заголовки слайдов 88–104px, line-height ~1.0. Вес 700. Sentence case.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:64px;line-height:0.98;color:#E7E4DD;\">Техника важнее веса на штанге<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:36px;align-items:flex-start;padding:28px 0;border-top:1px solid #23262c;\">\n        <div style=\"flex:0 0 220px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#12B886;\">Inter Tight<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8B8880;margin-top:8px;line-height:1.45;\">Body 38–42px на слайде, цвет #D2CEC6. Вес 400–500.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;font-size:28px;line-height:1.4;color:#D2CEC6;max-width:720px;\">Решение принимается по предсказанной выручке, а не по фактической. Ненормально, когда никто не проверяет вход.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:36px;align-items:flex-start;padding:28px 0;border-top:1px solid #23262c;border-bottom:1px solid #23262c;\">\n        <div style=\"flex:0 0 220px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#12B886;\">JetBrains Mono<\u002Fdiv>\n          <div style=\"font-size:13px;color:#8B8880;margin-top:8px;line-height:1.45;\">Все цифры и метрики, эйбрау-метки (+0.2em, uppercase), нумерация слайдов.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;align-items:baseline;gap:32px;flex-wrap:wrap;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:72px;line-height:0.9;color:#12B886;\">600%<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:72px;line-height:0.9;color:#12B886;\">×7<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.2em;text-transform:uppercase;color:#8B8880;\">01 / 07<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"covers\" style=\"max-width:1240px;margin:0 auto 80px;\">\n    <div style=\"margin-bottom:28px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:#12B886;margin-bottom:12px;\">04 · Каверы<\u002Fdiv>\n      <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:40px;line-height:0.95;text-transform:uppercase;letter-spacing:0.01em;color:#E7E4DD;\">Рабочие обложки каруселей<\u002Fdiv>\n      <div style=\"font-size:15px;color:#8B8880;margin-top:10px;max-width:680px;line-height:1.5;\">Формат 1080×1350. Сверху эйбрау и счётчик, снизу футер с border-top 2px. Заголовок 100–106px, подзаголовок 46px дымом.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;\">\n\n      <div style=\"flex:0 0 auto;\">\n        <div style=\"width:346px;height:432px;overflow:hidden;border:1px solid #23262c;position:relative;\">\n          <div style=\"position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(0.32);transform-origin:top left;background:#15171B;\">\n            <div style=\"position:absolute;inset:80px;display:flex;flex-direction:column;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.2em;text-transform:uppercase;color:#12B886;white-space:nowrap;\">Новости канала · ASA<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#8B8880;white-space:nowrap;\">01 / 06<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;\">\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:96px;line-height:1.02;color:#E7E4DD;\">ASA двадцать лет судила по весу на штанге?<\u002Fdiv>\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:44px;color:#8B8880;margin-top:24px;\">Apple добавила оценку <span style=\"color:#12B886;\">за технику.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:40px;border-top:2px solid #2a2d34;display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;color:#E7E4DD;background:#1E2A44;padding:12px 22px;\">WWDC'26<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:27px;color:#12B886;\">листай →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#5c5a54;padding:12px 2px 0;\">002 · ASA · ХУК-ВОПРОС<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:0 0 auto;\">\n        <div style=\"width:346px;height:432px;overflow:hidden;border:1px solid #23262c;position:relative;\">\n          <div style=\"position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(0.32);transform-origin:top left;background:#15171B;\">\n            <div style=\"position:absolute;inset:80px;display:flex;flex-direction:column;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.2em;text-transform:uppercase;color:#12B886;white-space:nowrap;\">Разбор · рынок 2026<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#8B8880;white-space:nowrap;\">01 / 07<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;max-width:600px;\">\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:112px;line-height:0.96;color:#E7E4DD;\">Мобильный гейминг <span style=\"color:#12B886;\">всё?<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:46px;color:#8B8880;margin-top:26px;max-width:560px;line-height:1.06;\">Загрузки падают четвёртый квартал подряд, а выручка стоит на месте.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:40px;border-top:2px solid #2a2d34;display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:0.12em;text-transform:uppercase;color:#8B8880;white-space:nowrap;\">Гейминг vs подписки<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:27px;color:#12B886;\">листай →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#5c5a54;padding:12px 2px 0;\">009 · ГЕЙМИНГ VS ПОДПИСКИ<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:0 0 auto;\">\n        <div style=\"width:346px;height:432px;overflow:hidden;border:1px solid #23262c;position:relative;\">\n          <div style=\"position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(0.32);transform-origin:top left;background:#15171B;\">\n            <div style=\"position:absolute;inset:80px;display:flex;flex-direction:column;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.2em;text-transform:uppercase;color:#12B886;white-space:nowrap;\">Разбор · данные и прогноз<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#8B8880;white-space:nowrap;\">01 / 07<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;max-width:620px;\">\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:106px;line-height:0.96;color:#E7E4DD;\">Модели выручки питаются <span style=\"color:#12B886;\">чем попало<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:46px;color:#8B8880;margin-top:26px;max-width:580px;line-height:1.06;\">Мобильные игры и подписочные аппы живут на прогнозе. Вопрос в том, что заходит в формулу.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:40px;border-top:2px solid #2a2d34;display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:0.12em;text-transform:uppercase;color:#8B8880;white-space:nowrap;\">Данные для предиктора<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:27px;color:#12B886;\">листай →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#5c5a54;padding:12px 2px 0;\">010 · ПЛАН ПИТАНИЯ ПРЕДИКТОРА<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:0 0 auto;\">\n        <div style=\"width:346px;height:432px;overflow:hidden;border:1px solid #23262c;position:relative;\">\n          <div style=\"position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(0.32);transform-origin:top left;background:#12B886;\">\n            <div style=\"position:absolute;inset:80px;display:flex;flex-direction:column;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.2em;text-transform:uppercase;color:#0c1512;white-space:nowrap;\">Главное<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#0c1512;opacity:0.55;white-space:nowrap;\">07 / 07<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:48px;max-width:700px;\">\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:84px;line-height:0.98;color:#0c1512;\">Фундамент в данных это не гигиена ради гигиены<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;font-size:42px;color:#0c1512;line-height:1.34;max-width:820px;\">Если вы уже на стадии платного привлечения, а сверки с трёх сторон нет, вы рискуете не отчётом.<\u002Fdiv>\n              <div style=\"margin-top:22px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:72px;line-height:1.0;color:#0c1512;\">Вы рискуете продуктом.<\u002Fdiv>\n              <div style=\"margin-top:auto;background:#15171B;border-radius:16px;padding:26px 30px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.2em;text-transform:uppercase;color:#12B886;margin-bottom:14px;\">Го в комменты →<\u002Fdiv>\n                <div style=\"font-size:36px;line-height:1.25;color:#E7E4DD;\">Какой <span style=\"color:#12B886;font-weight:600;\">рацион<\u002Fspan> у вашей модели?<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:28px;padding-top:26px;border-top:2px solid rgba(12,21,18,0.3);display:flex;align-items:center;gap:16px;\">\n                <svg width=\"112\" height=\"67\" sc-camel-view-box=\"0 0 200 120\" fill=\"none\"><rect x=\"28\" y=\"53\" width=\"6\" height=\"14\" fill=\"#0c1512\"><\u002Frect><rect x=\"166\" y=\"53\" width=\"6\" height=\"14\" fill=\"#0c1512\"><\u002Frect><rect x=\"40\" y=\"47\" width=\"9\" height=\"26\" fill=\"#0c1512\"><\u002Frect><rect x=\"151\" y=\"47\" width=\"9\" height=\"26\" fill=\"#0c1512\"><\u002Frect><rect x=\"56\" y=\"38\" width=\"13\" height=\"44\" fill=\"#0c1512\"><\u002Frect><rect x=\"131\" y=\"38\" width=\"13\" height=\"44\" fill=\"#0c1512\"><\u002Frect><rect x=\"69\" y=\"57\" width=\"62\" height=\"6\" fill=\"#0c1512\"><\u002Frect><\u002Fsvg>\n                <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:32px;letter-spacing:0.12em;text-transform:uppercase;color:#0c1512;\">CPA Instructor<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#5c5a54;padding:12px 2px 0;\">ФИНАЛ-CTA · ИЗУМРУД<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"banner\" style=\"max-width:1240px;margin:0 auto 80px;\">\n    <div style=\"margin-bottom:28px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:#12B886;margin-bottom:12px;\">05 · Профиль<\u002Fdiv>\n      <div style=\"font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:40px;line-height:0.95;text-transform:uppercase;letter-spacing:0.01em;color:#E7E4DD;\">Баннер LinkedIn · 1584×396<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:1000px;max-width:100%;height:250px;overflow:hidden;border:1px solid #23262c;position:relative;\">\n      <div style=\"po
